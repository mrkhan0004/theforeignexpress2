<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ef">
  <meta name="description" content="The Foreign Express Academic IELTS practice player with split-screen tasks, a timer, answer navigation and browser-based speaking recording.">
  <title>Academic IELTS Test Player — The Foreign Express</title>
  <!-- PRE-RENDER GATE: check localStorage before any HTML paints -->
  <script>
    (function(){
      var sess = null, adm = false;
      try { sess = localStorage.getItem('fe_session'); } catch(e){}
      try { adm = !!JSON.parse(localStorage.getItem('fe_admin')); } catch(e){}
      if(!sess && !adm){
        document.documentElement.style.visibility = 'hidden';
        var dest = 'login.html?next=' + encodeURIComponent(location.pathname + location.search);
        window.location.replace(dest);
      }
    }());
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/visual-refresh.css">
  <link rel="stylesheet" href="css/roveia-theme.css">
  <link rel="stylesheet" href="css/ielts-player.css">
</head>
<body class="ielts-player-body">
  <div id="site-header"></div>
  <main id="teRoot" aria-live="polite"></main>
  <div id="site-footer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
  <script src="js/tests-data.js"></script>
  <script src="js/ielts-player.js"></script>
</body>
</html>
